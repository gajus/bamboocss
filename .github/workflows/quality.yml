name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes to the repo. Without this the job token inherits whatever the
# repository default is, which for older repos is read/write across every scope.
permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run oxfmt
        run: pnpm fmt

  # Split three ways because this job was the critical path: ~47s of install
  # followed by ~295s of tests, while no other job in the workflow ran past 2
  # minutes. vitest divides by file count rather than duration, so the shard that
  # draws the packed consumer test -- which waits for every other file in its
  # shard -- tends to run longest.
  #
  # `fail-fast: false` so one failing shard does not cancel the others; knowing
  # only that "a shard failed" means re-running to find out what else broke.
  #
  # This trades runner minutes for wall clock: three shards pay the install cost
  # three times. The jobs run in parallel, so that buys back nothing on a busy
  # runner pool -- revisit if queueing becomes the bottleneck rather than the tests.
  tests:
    name: Unit Tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run tests
        run: pnpm test run --shard=${{ matrix.shard }}/3

  # Separate job, not a fourth shard. The shards do collect the scenario suites
  # under sandbox/codegen/__tests__, but the strict suites assert types --
  # `@ts-expect-error` and `assertType` against each scenario's generated
  # styled-system -- which only a type check reads. This job runs them under
  # `vitest --typecheck`, and the sandbox under `tsc`.
  codegen:
    name: Codegen Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run codegen tests
        run: pnpm test:codegen

  # A report, not a gate, and only on pull requests.
  #
  # `packages/core/src/layers.ts` carried a private `Map` that was declared, iterated once, and
  # written nowhere — so its loop body could never run. Nothing here saw it: knip 6 has no
  # class-member analysis at all, and the static tools that do — `tsc --noUnusedLocals`, ESLint's
  # `no-unused-private-class-members` — ask whether a symbol is *referenced*. It was; the loop read
  # it. "Never written, therefore always empty" is a dataflow property, and coverage is the only
  # signal in this repo that can see it.
  #
  # Deliberately not a threshold. A percentage gate fails on unrelated drift and teaches people to
  # route around it, and plenty of uncovered lines are correct — the `INVALID_LAYER` throw in that
  # same file is meant never to run. Scoped to the files a pull request changed, because a
  # whole-repo uncovered list is thousands of lines nobody reads.
  #
  # Unsharded, unlike the test job: merging per-shard coverage needs a report-merge step, and this
  # runs in parallel with everything else so it costs wall clock only if it becomes the slowest job.
  coverage:
    name: Coverage Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # Full history: the report diffs against the base branch, which a shallow clone cannot see.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Never fails the build; `$GITHUB_STEP_SUMMARY` puts it on the run's summary page, which is
      # where someone reviewing the change will actually see it.
      - name: Report uncovered lines in this diff
        run: node .github/scripts/uncovered-in-diff.mjs origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      # `pnpm install` runs `prepare`, which is `build-fast` -- no type declarations and
      # none of the `postbuild` steps that write the prebuilt artifacts under
      # `packages/generator/src/artifacts/generated`. So nothing here exercises the full
      # build, and a broken postbuild script leaves CI green.
      - name: Run build
        run: pnpm build

      # Those artifacts are generated *and* tracked, so a build that regenerates them
      # differently means the committed copies are stale. Left unchecked they flip back
      # and forth on every build.
      #
      # `git status --porcelain` rather than `git diff`: a build that starts emitting a
      # *new* generated file leaves it untracked, which `git diff` does not see. Build
      # output that is meant to stay out of the tree is gitignored, so it does not show
      # up here either way.
      - name: Check generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output differs after a build. Run 'pnpm build' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  # A framework whose only proof of working is its own build. `.astro` files have no test
  # suite of their own, and this sandbox failed to extract for several releases with nothing
  # noticing — the docs described a setup no build ran.
  astro:
    name: Astro Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build the Astro sandbox
        working-directory: sandbox/astro
        run: |
          pnpm run prepare
          pnpm run build

      # A green build is not enough: the page has to carry both the class and its rule.
      - name: Check the page is styled
        working-directory: sandbox/astro
        run: |
          grep -q 'bg_green\.600' dist/index.html
          grep -q 'p_40px{padding:40px}' dist/index.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run oxlint
        run: pnpm lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run knip
        run: pnpm knip

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run TypeScript type check
        run: pnpm typecheck
