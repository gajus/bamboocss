name: Publish

on:
  push:
    paths:
      - '.changeset/**'
      - 'packages/**'
    branches:
      - main
  # The push filter above means a commit touching only .github or the website never
  # runs this, so there is otherwise no way to re-open the Version Packages PR --
  # or to retry a publish -- without manufacturing a commit under packages/.
  pull_request:
    paths:
      - '.github/workflows/release.yaml'
      - 'packages/native-extractor/**'
      - 'packages/node/package.json'
      - 'packages/node/src/builder.ts'
      - 'packages/node/src/create-context.ts'
      - 'packages/node/src/debug.ts'
      - 'packages/node/src/generate.ts'
      - 'packages/node/src/parser-result.ts'
      - 'packages/types/src/parser.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Publishing is not safe to run twice at once: two jobs can race to version, tag and
# push the same packages. Unlike the other workflows this must never cancel a run in
# flight -- killing it mid-publish is how you get a tag with no npm release behind it.
concurrency:
  group: publish
  cancel-in-progress: false

# changesets writes: it commits version bumps, pushes tags and cuts GitHub releases,
# and opens the "Version Packages" pull request.
#
# `id-token` is not for that -- it is what npm Trusted Publishing needs to mint an
# OIDC token instead of a long-lived NPM_TOKEN. It always defaults to `none`, even
# under a permissive repository default, so it has to be asked for explicitly. On its
# own it publishes nothing: each package also has to name this repo and workflow as a
# trusted publisher on npmjs.com.
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  native-build:
    name: Native extractor (${{ matrix.binary }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            binary: darwin-arm64.node
          - runner: macos-15-intel
            binary: darwin-x64.node
          # Built with cargo-zigbuild, so a binary does not need the runner's glibc: a gnu target
          # names the release to link against, 2.17, where a runner's own made it 2.34. Each loads
          # on the oldest system it is for. Node 22 needs glibc 2.28, which is RHEL 8's.
          - runner: ubuntu-24.04-arm
            binary: linux-arm64-gnu.node
            target: aarch64-unknown-linux-gnu.2.17
            image: registry.access.redhat.com/ubi8/nodejs-22-minimal
          - runner: ubuntu-24.04-arm
            binary: linux-arm64-musl.node
            target: aarch64-unknown-linux-musl
            image: node:22-alpine
          - runner: ubuntu-latest
            binary: linux-x64-gnu.node
            target: x86_64-unknown-linux-gnu.2.17
            image: registry.access.redhat.com/ubi8/nodejs-22-minimal
          - runner: ubuntu-latest
            binary: linux-x64-musl.node
            target: x86_64-unknown-linux-musl
            image: node:22-alpine
          - runner: windows-latest
            binary: win32-x64-msvc.node
          - runner: windows-11-arm
            binary: win32-arm64-msvc.node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned, as the toolchain is: Zig's release decides what the binary is linked against.
      - name: Install cargo-zigbuild
        if: matrix.target
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.17.0 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build native extractor
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd packages/native-extractor
          sh scripts/build.sh --release ${TARGET:+--target "$TARGET"}
          mkdir -p prebuilds
          cp bamboo-native-extractor.node "prebuilds/${{ matrix.binary }}"

      - name: Load native extractor
        if: ${{ !matrix.image }}
        run: node packages/native-extractor/scripts/smoke.cjs packages/native-extractor/prebuilds/${{ matrix.binary }}

      - name: Load native extractor on ${{ matrix.image }}
        if: matrix.image
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work ${{ matrix.image }} node
          packages/native-extractor/scripts/smoke.cjs packages/native-extractor/prebuilds/${{ matrix.binary }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.binary }}
          path: packages/native-extractor/prebuilds/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: native-build
    runs-on: ubuntu-latest
    # npm binds a trusted publisher to repository + workflow filename + environment.
    # All three are load-bearing: this is `.github/workflows/release.yaml` and the
    # environment is `release`. Renaming either breaks publishing with the same
    # unhelpful E404 that an unauthenticated publish gives.
    environment: release
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/node/dist/native
          merge-multiple: true

      - name: Verify Node package native contents
        run: |
          for binary in \
            darwin-arm64.node \
            darwin-x64.node \
            linux-arm64-gnu.node \
            linux-arm64-musl.node \
            linux-x64-gnu.node \
            linux-x64-musl.node \
            win32-arm64-msvc.node \
            win32-x64-msvc.node
          do
            test -f "packages/node/dist/native/$binary"
          done

      # A package npm has never seen cannot be published by this job. Trusted publishing
      # binds a publisher to an *existing* package, so the first release of a new one is a
      # `PUT` that creates it -- and the registry refuses that under OIDC with the same bare
      # `E404 Not Found` an unauthenticated publish gives. Nothing in the message says the
      # package is new.
      #
      # It half-ships the release when it happens: every other package publishes, and the new
      # one is left missing while its dependents already pin the version that does not exist.
      # `@bamboocss/ts-ast@1.50.0` went out that way -- 23 packages published against a
      # dependency that was not there.
      #
      # So a new package is published once by hand, `npm publish --access public` with a
      # token, at the version this repository is about to release. After that it exists, this
      # job can update it, and it needs the trusted publisher configured on npmjs.com --
      # repository, workflow filename and environment all matching exactly.
      - name: Publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          # Deliberately empty, not removed. changesets only falls through to OIDC
          # when NPM_TOKEN is present and blank; leaving it unset makes it take the
          # token path and fail unauthenticated.
          # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          NPM_TOKEN: ''
