name: Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'packages/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - 'packages/**'
      - '.github/workflows/website.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deployment is authenticated by the Cloudflare token, not the job token, so this
# needs nothing beyond reading the tree.
permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      # A dead internal link does not fail `next build` -- the page renders and the
      # href simply 404s for the reader -- so it is checked separately, before the
      # slow step rather than after it.
      - name: Check internal links
        run: pnpm --filter=website check-links

      # `website` builds the workspace packages first (its own `prebuild`), then
      # Velite, Open Graph images and the prerendered React Router site in `build/client`.
      #
      # VITE_PUBLIC_URL has to be set *here*, not at deploy time: the pages and text
      # endpoints are prerendered during this step, so absolute URLs are baked into
      # the output. Without it they use http://localhost:3000 and nothing fails loudly.
      - name: Build
        run: pnpm --filter=website build
        env:
          VITE_PUBLIC_URL: https://bamboocss.com

      # Assets-only deploy -- wrangler.jsonc declares no `main`, so this uploads
      # `build/client` to Cloudflare's asset store and runs no Worker code.
      #
      # Invoked through `pnpm dlx` rather than cloudflare/wrangler-action. The action
      # shells out to `npm i wrangler` inside `workingDirectory`, and website/package.json
      # declares `workspace:*` dependencies that npm cannot parse -- it fails with
      # EUNSUPPORTEDPROTOCOL before it ever reaches Cloudflare. `pnpm dlx` resolves
      # wrangler into a temp prefix instead, so the workspace manifest is never touched.
      #
      # The version is pinned. Left to itself the action installs its own default, which
      # on the v3 tag is wrangler 3.90.0 -- old enough to predate assets-only Workers.
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm dlx wrangler@4.118.0 deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
