packages:
  - 'packages/**'
  - 'sandbox/*'
  - 'sandbox/component-lib/**'
  - 'website'

overrides:
  dts-bundle-generator>typescript: 5.9.3

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: true
  core-js: false
  # Dev-only template-literal helper pulled in by the eslint plugin; its build
  # script is not needed, but pnpm fails the install unless the decision is stated.
  multiline-ts: false
  core-js-pure: false
  es5-ext: false
  gatsby: false
  gatsby-cli: false
